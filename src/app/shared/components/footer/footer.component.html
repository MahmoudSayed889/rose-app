<footer class="bg-[#27272A] text-[#F7FAFC] pt-16 pb-10 px-6 md:px-20 min-h-100">
  
  <div class="flex flex-wrap gap-12 md:gap-24 items-start">
    
    <div class="flex flex-col gap-6">
      <img src="/assets/imgs/logo.png" alt="Logo" class="h-40 w-auto">
      <div class="flex flex-col gap-2 pt-3">
          <p class="text-[#FFA3B9]  leading-1 font-semibold">Rose E-Commerce App</p>
          <p class="text-sm text-[#F4F4F5]">All rights reserved | 2025</p>
      </div>
    </div>


    <div class="flex flex-col gap-4">
      <h3 class="text-lg leading-0 font-bold mt-3 text-[#FBB6CE]">Discover our website</h3>
      <ul class="space-y-3 leading-[100%] text-sm  tracking-normal font-mediumtext-">
        @for (link of links; track link.url) {
          <li>
            <a [routerLink]="link.url" class="hover:text-[#FBB6CE] transition-colors duration-200">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>


    <div class="flex flex-col gap-4 ml-auto w-full max-w-md">
      <h3 class="text-lg text-[#FFA3B9] mt-3 font-bold leading-0">Get   <span class="text-[#FBEAEA] font-semibold">20%</span> Off Discount Coupon</h3>
      <p class="text-sm text-[#71717A] mb-1 leading-0 ">By subscribing to our newsletter</p>
 
  <p-inputGroup class="my-custom-search-bar ">
        <input type="text" pInputText placeholder="Enter Your Email " class="w-full" />
        <button type="button" pButton label="Subscribe →" class="p-button-secondary placeholder:text-[#A1A1AA]"></button>
      </p-inputGroup>
    </div>
    
  </div>
</footer>
