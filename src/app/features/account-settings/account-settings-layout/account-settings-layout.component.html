<section class="max-w-7xl mx-auto my-10">
  <h1 class="text-5xl font-bold text-zinc-800 dark:text-zinc-100 mb-9">
    {{ 'account-settings.title' | translate }}
  </h1>
  <div class="flex gap-9 min-h-180">
    <div
      class="max-w-75 w-full flex flex-col justify-between bg-zinc-50 dark:bg-[#121212] border border-zinc-100 p-4 rounded-2xl"
    >
      <div class="space-y-2.5">
        <div>
          <lib-button
            routerLink="profile"
            [isActive]="isActive('profile')"
            activeStyle="bg-zinc-800 text-zinc-50"
            [iconLucide]="{
              name: icons.UserPen,
              size: '24px',
            }"
            [text]="'account-settings.profile.title' | translate"
            styleClass="flex-row-reverse  w-full py-3 px-4 rounded-[8px] font-medium justify-end"
          ></lib-button>
        </div>
        <div>
          <lib-button
            routerLink="change-password"
            [isActive]="isActive('change-password')"
            activeStyle="bg-zinc-800 text-zinc-50"
            [iconLucide]="{
              name: icons.Lock,
              size: '24px',
            }"
            [text]="'account-settings.change_password.title' | translate"
            styleClass="flex-row-reverse  w-full py-3 px-4 rounded-[8px] font-medium justify-end"
          ></lib-button>
        </div>
      </div>
      <div>
        <lib-button
          (onClick)="_authService.logout()"
          [text]="'auth.logout' | translate"
          [iconLucide]="{
            name: icons.LogOut,
            size: '20px',
          }"
          styleClass="flex-row-reverse bg-zinc-100 text-[#CD2E33] w-full py-3 px-4 rounded-[8px] font-medium justify-end"
        ></lib-button>
      </div>
    </div>
    <div class="max-h-fit grow">
      <router-outlet></router-outlet>
    </div>
  </div>
</section>
