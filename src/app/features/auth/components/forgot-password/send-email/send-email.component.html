<section>
  <header class="mb-6">
    <h1 class="text-2xl font-semibold text-zinc-800 mb-1 dark:text-zinc-50">Forgot Password?</h1>
    <p class="text-zinc-800 mb-4 dark:text-zinc-50">Worry not, we’ll send you instructions to help you reset it.</p>
    <app-sp-line></app-sp-line>
  </header>
  <form [formGroup]="sendEmailForm" (ngSubmit)="onSubmit()" class="space-y-9">
    <div class="">
      <lib-input
        label="Email"
        inputType="email"
        labelForAndInputId="email"
        placeholder="user@example.com"
        formControlName="email"
        [errorMessage]="emailError"
      ></lib-input>
    </div>
    <div class="">
      <lib-button
        type="submit"
        text="Continue"
        styleClass="bg-primary w-full text-white py-3.5 px-4 rounded-[10px] font-medium cursor-pointer"
        [disabled]="sendEmailForm.invalid"
        [loading]="isLoading()"
      ></lib-button>
    </div>
    <div class="text-center">
      <app-sp-line></app-sp-line>
      <p class="text-zinc-800 text-sm font-medium mt-5 dark:text-zinc-50">
        Don’t have an account yet?
        <a routerLink="/register" class="font-bold text-primary">Create one now!</a>
      </p>
    </div>
  </form>
</section>
