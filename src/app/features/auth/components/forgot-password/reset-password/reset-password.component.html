<section>
  <header class="mb-9 text-zinc-800 dark:text-zinc-50">
    <h2 class="text-2xl font-semibold mb-1">{{'auth.forgot-password.Create a new password'|translate}}</h2>
    <p class="mb-4">{{'auth.forgot-password.Set a strong password to secure your account.'|translate}}</p>
    <app-sp-line></app-sp-line>
  </header>
  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="">
    <div class="space-y-4 mb-9">
      <div class="space-y-1.5">
        <lib-input
          [label]="'auth.password'|translate"
          inputId="password"
          placeholder="********"
          formControlName="newPassword"
          type="password"
        ></lib-input>
      </div>
      <div class="space-y-1.5">
        <lib-input
          [label]="'auth.confirmPassword'|translate"
          inputId="confirmPassword"
          placeholder="********"
          formControlName="confirmPassword"
          type="password"
        ></lib-input>
      </div>
    </div>
    <div class="mb-9">
      <lib-button
        type="submit"
        [loading]="isLoading()"
        [text]="'auth.forgot-password.resetPassword'|translate"
        styleClass="bg-primary text-white font-medium w-full py-3.5 px-4 rounded-[10px] cursor-pointer"
        [disabled]="resetPasswordForm.invalid || isLoading()"
        [loading]="isLoading()"
      ></lib-button>
    </div>
    <div class="text-center">
      <app-sp-line></app-sp-line>
      <p class="mt-5 text-sm font-medium text-zinc-800 dark:text-primary">
        {{'common.Need help?'|translate}} <a class="text-primary" href="">{{'common.Contact us'|translate}}</a>
      </p>
    </div>
  </form>
</section>
