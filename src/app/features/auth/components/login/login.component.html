
<h2 class="font-edwardian text-center text-primary text-5xl mb-4">Welcome back!</h2>
<app-sp-line></app-sp-line>

<form class="mt-7" [formGroup]="form" (ngSubmit)="login()">
    <div class="mb-4">
        <lib-input
            label="username"
            inputType="username"
            labelForAndInputId="username"
            placeholder="user@123"
            formControlName="username"
        ></lib-input>
    </div>

    <div class="">
        <lib-input
            label="password"
            inputType="password"
            labelForAndInputId="password"
            placeholder="********"
            formControlName="password"
        ></lib-input>
    </div>


    <div class="flex justify-end">
        <a routerLink="/forgot-pass" class="text-primary font-bold">Forgot your password?</a>
    </div>

    <div class="flex items-center gap-1">
        <p-checkbox inputId="rememberMe" name="remember" value="true" checkbox.root.borderRadius="50rem"/>
        <label for="rememberMe" class="ml-2"> Remember me </label>
    </div>

    <lib-button
        type="submit"
        text="login"
        styleClass="bg-primary mt-7 rounded-lg p-2 text-white w-full"
        [disabled]="form.invalid"
        [loading]="formSubmited()"
    ></lib-button>

</form>


<div class="mt-7">
    <app-sp-line></app-sp-line>
</div>

<p class="text-center my-7">
    Don’t have an account yet? 
    <a routerLink="/register" class="text-primary font-bold">Create one now!</a>
</p>
