<div class="container mx-auto my-12 md:my-20 lg:my-28 px-4 sm:px-6 lg:px-8">
  <div
    class="flex flex-col justify-center items-center gap-6 md:gap-10 py-10 px-6 md:py-16 md:px-12 bg-[#FBEAEA] dark:bg-[#3F3F46] rounded-2xl min-h-75"
  >
    <h3
      class="text-2xl sm:text-3xl lg:text-4xl font-bold text-center text-[#741C21] dark:text-[#FFC2D0] max-w-2xl leading-tight"
    >
      {{ 'trustedBy.prefix' | translate }}
      <span class="text-[#FF668B] dark:text-[#D75458]">{{ 'trustedBy.count' | translate }}</span>
      {{ 'trustedBy.suffix' | translate }}
    </h3>

    <div class="flex flex-wrap justify-center items-center gap-6 sm:gap-8 md:gap-12 w-full">
      @for (logo of companyLogos; track logo) {
        <img
          [src]="logo"
          alt="trusted-by"
          class="w-20 h-20 sm:w-28 sm:h-28 md:w-36 md:h-36 object-contain grayscale hover:grayscale-0 transition-all duration-300"
        />
      }
    </div>
  </div>
</div>
