<div class="max-w-[80vw] mx-auto my-30">
  <div
    class="flex flex-col justify-center gap-4 h-[50vh] items-center bg-[#FBEAEA] dark:bg-[#3F3F46] rounded-2xl"
  >
    <h3 class="text-4xl font-bold text-center text-[#741C21] dark:text-[#FFC2D0]">
      {{ 'trustedBy.prefix' | translate }}
      <span class="text-[#FF668B] dark:text-[#D75458]">{{ 'trustedBy.count' | translate }}</span>
      {{ 'trustedBy.suffix' | translate }}
    </h3>
    <div class="flex flex-row justify-around items-center w-full gap-4">
      @for (logo of companyLogos; track logo) {
        <img [src]="logo" alt="trusted-by" class="w-40 h-40" />
      }
    </div>
  </div>
</div>
