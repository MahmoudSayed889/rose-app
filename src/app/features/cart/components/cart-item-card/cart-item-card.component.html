<div class="flex gap-5 px-5 py-5 sm:px-6 sm:py-6" [class.border-b]="!isLast()" [class.border-zinc-200]="!isLast()">
  <div class="shrink-0">
    <img [src]="item().product.cover" [alt]="item().product.title"
      class="h-27.5 w-27.5 rounded-[10px] object-cover sm:h-30 sm:w-30" />
  </div>

  <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
    <div class="space-y-2">
      <h2 class="truncate text-lg font-semibold text-[#741C21] dark:text-[#FFC2D0]">
        {{ item().product.title }}
      </h2>

      <div class="flex flex-wrap items-center gap-1.5 text-sm sm:text-[0.95rem]">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-[#FBA707]"
          aria-hidden="true">
          <path fill-rule="evenodd"
            d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
            clip-rule="evenodd" />
        </svg>
        <span class="text-zinc-800 dark:text-zinc-100">Rating: {{ item().product.rating|number: '1.1-1' }}/5</span>
        <a href="#" class="font-medium text-blue-600 dark:text-blue-400 hover:underline">
          ({{ item().product.ratings }} ratings)
        </a>
      </div>
    </div>

    <p class="text-lg font-bold text-zinc-800 dark:text-zinc-100">
      <span class="mr-1 text-sm font-semibold text-primary">
        (x{{ item().quantity }})
      </span>
      {{ item().product.price| number: '1.2-2' }} <span class="text-sm">EGP</span>
    </p>
  </div>

  <div class="flex shrink-0 flex-col items-end justify-between gap-4">
    <button type="button"
      class="inline-flex items-center gap-2 rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="removeLoading()" (click)="onRemove()">
      <i class="pi pi-trash text-sm"></i>
      {{'common.actions.Remove'|translate}}
    </button>

    <div class="flex items-center gap-2">
      <button type="button"
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#FBEAEA] dark:bg-zinc-700 text-xl font-medium leading-none text-primary transition hover:scale-110 cursor-pointer"
        aria-label="Decrease quantity" (click)="onDecreaseQuantity()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-minus-icon lucide-minus">
          <path d="M5 12h14" />
        </svg>
      </button>

      <input type="text" [value]="item().quantity" readonly
        class="h-10 w-12 rounded-lg border border-zinc-300 bg-white text-center text-sm font-medium text-zinc-800 outline-none"
        aria-label="Quantity" />

      <button type="button"
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#FBEAEA] dark:bg-zinc-700 text-xl font-medium leading-none text-primary transition-opacity hover:scale-110 cursor-pointer"
        aria-label="Increase quantity" (click)="onIncreaseQuantity()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-plus-icon lucide-plus">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      </button>
    </div>
  </div>
</div>
