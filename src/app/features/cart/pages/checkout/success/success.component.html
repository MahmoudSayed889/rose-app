<div class="container mx-auto h-[75vh] flex justify-center items-center px-6 md:px-0">
    <div class="flex flex-col justify-center items-center bg-zinc-50 dark:bg-zinc-900 w-[90%] md:w-[75%] h-[90%] rounded-2xl">
        <div class="mb-16 flex flex-col justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 24 24" fill="none"
                stroke="green" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-credit-card-check-icon lucide-credit-card-check">
                <path d="M12.5 19H4a2 2 0 01-2-2V7a2 2 0 012-2h16a2 2 0 012 2v4" />
                <path d="m16 17 2 2 4-4" />
                <path d="M2 10h20" />
            </svg>

            <p class="text-2xl capitalize">{{'checkout.success.payment successful' | translate}}</p>
        </div>

        <div class="flex items-center gap-5">
            <lib-button styleClass="bg-white dark:bg-zinc-900 text-primary hover:bg-primary hover:text-white border border-2 border-primary px-12 py-3 rounded-lg" routerLink="/orders"
                [text]="'checkout.success.view orders' | translate">
            </lib-button>

            <lib-button styleClass="bg-white dark:bg-zinc-900 text-primary hover:bg-primary hover:text-white border border-2 border-primary px-12 py-3 rounded-lg" routerLink="/products"
                [text]="'checkout.success.explore products' | translate">
            </lib-button>
        </div>
    </div>
</div>
