<div class="relative space-y-1.5 p-4 transition-colors" [class]="cardStyle()">
  <div class="flex items-center justify-between gap-2">
    <h4 class="font-semibold text-zinc-800 dark:text-zinc-50 truncate">
      {{ notification().title }}
    </h4>
    <button
      type="button"
      aria-label="Notification options"
      cdkOverlayOrigin
      #menuTrigger="cdkOverlayOrigin"
      [attr.aria-expanded]="optionsOpen()"
      class="cursor-pointer rounded p-1 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200"
      (click)="optionsOpen.set(true)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-ellipsis-vertical-icon lucide-ellipsis-vertical"
      >
        <circle cx="12" cy="12" r="1" />
        <circle cx="12" cy="5" r="1" />
        <circle cx="12" cy="19" r="1" />
      </svg>
    </button>
  </div>
  <p class="line-clamp-3 text-sm text-zinc-500 dark:text-zinc-400 leading-4">
    {{ notification().message }}
  </p>

  <!-- CDK Overlay Template -->
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="menuTrigger"
    [cdkConnectedOverlayOpen]="optionsOpen()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="optionsOpen.set(false)"
    (detach)="optionsOpen.set(false)"
  >
    <div
      role="menu"
      class="w-48 rounded-xl border border-zinc-100 bg-white p-1.5 shadow-lg dark:border-zinc-700 dark:bg-zinc-800"
    >
      <button
        type="button"
        role="menuitem"
        [disabled]="notification().isRead"
        (click)="markAsRead()"
        class="flex w-full enabled:cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-100 disabled:cursor-not-allowed disabled:text-zinc-400 dark:text-zinc-200 dark:hover:bg-zinc-700/50 dark:disabled:text-zinc-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-check"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Mark as read</span>
      </button>

      <button
        type="button"
        role="menuitem"
        (click)="deleteNotification()"
        class="flex w-full enabled:cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-trash-2"
        >
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
        <span>Delete notification</span>
      </button>
    </div>
  </ng-template>
</div>
