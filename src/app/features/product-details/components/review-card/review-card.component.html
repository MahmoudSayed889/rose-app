<article class="pb-4 ">
    <div class="mb-2.5">
        <div class="flex items-center gap-2.5 mb-2.5">
            <div
                class="w-11.25 h-11.25 rounded-full bg-[#A6252A] flex items-center justify-center text-white text-xl font-semibold">
                A
            </div>
            <div class="">
                <p class="font-semibold">{{review().user.firstName}}</p>
                <p class="font-medium text-sm text-zinc-400 dark:text-zinc-500">
                    {{review().createdAt | date: 'mediumDate'}}
                </p>
            </div>
        </div>
        <div class="flex items-center mb-2.5 gap-1">
            <div>
                @for (star of starsInfo().fullStarsArray; track $index) {
                <i class="fa-solid fa-star text-[#FFA508]"></i>
                }
                @if(starsInfo().hasHalfStar) {
                <i class="fa-solid fa-star-half text-[#FFA508]"></i>
                }
                @for (star of starsInfo().emptyStarsArray; track $index) {
                <i class="fa-regular fa-star text-[#FFA508]"></i>
                }
            </div>
            <span class="font-semibold">({{review().rating}})</span>
        </div>
        <div class="">
            <p class="font-semibold mb-1.5 dark:text-zinc-50">{{review().headline}}</p>
            <p class="text-zinc-600 dark:text-zinc-300">{{review().content}}</p>
        </div>
    </div>
        <app-sp-line></app-sp-line>
</article>
