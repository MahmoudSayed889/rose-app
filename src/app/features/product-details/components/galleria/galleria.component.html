<div class="card">
    <p-galleria [value]="images()"
        [numVisible]="5">
        <ng-template #item let-item>
            <img class="w-full h-100 object-cover" [src]="item.itemImageSrc" />
        </ng-template>
        <ng-template #thumbnail let-item>
            <img class="w-full h-25 object-cover" [src]="item.itemImageSrc" />
        </ng-template>
    </p-galleria>
</div>
