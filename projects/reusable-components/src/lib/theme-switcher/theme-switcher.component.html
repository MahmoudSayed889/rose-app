<button (click)="toggleTheme()" class="p-1 cursor-pointer hover:text-primary transition-all flex items-center" [class]="styleClass()">
    @if (currentTheme() == 'dark') {
        <i class="pi pi-sun"></i>
    }

    @if (currentTheme() == 'light') {
        <i class="pi pi-moon"></i>
    }
</button>
