<div class="lib-input relative">
  @if (label) {
    <label [for]="labelForAndInputId" class="lib-input__label dark:text-white! capitalize">{{ label }}</label>
  }

  <input
    pInputText
    [id]="labelForAndInputId"
    [class]="styleClass"
    [type]="type == 'password' ? isShow ? 'text' : 'password' : type"
    [placeholder]="placeholder"
    [value]="value()"
    [disabled]="isDisabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [style.padding-inline-end]="type === 'password' ? '3rem' : null"
  />

  @if (type == 'password') {
    <div>
      <button type="button" class="btn-show bg-transparent p-2 cursor-pointer" (click)="show()">
        @if (isShow) {
          <lucide-angular [name]="icons.Eye" class="opacity-75" strokeWidth="1.5px"></lucide-angular>
        }
        @if (!isShow) {
          <lucide-angular [name]="icons.EyeOff" class="opacity-75" strokeWidth="1.5px"></lucide-angular>
        }
      </button>
    </div>
  }

  @if (errorMessage) {
    <p class="lib-input__error">{{ errorMessage }}</p>
  }
</div>
