<div class="lib-input">
  @if (label) {
    <label [for]="inputId" class="lib-input__label dark:text-white! capitalize">{{ label }}</label>
  }

  <div class="relative">
    <input
      pInputText
      [id]="inputId"
      class="w-full"
      [class]="styleClass"
      [type]="type == 'password' ? isPasswordVisible() ? 'text' : 'password' : type"
      [placeholder]="placeholder"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [invalid]="valid"
      variant="filled"
      [style.padding-inline-end]="type === 'password' ? '3rem' : null"
    />

    @if (type == 'password') {
      <div>
        <button type="button" class="btn-show bg-transparent p-2 cursor-pointer absolute bottom-0 right-1.75 rtl:right-auto rtl:left-1.75" (click)="togglePasswordVisibility()">
          @if (isPasswordVisible()) {
            <lucide-angular [name]="icons.Eye" class="opacity-75" strokeWidth="1.5px"></lucide-angular>
          }
          @if (!isPasswordVisible()) {
            <lucide-angular [name]="icons.EyeOff" class="opacity-75" strokeWidth="1.5px"></lucide-angular>
          }
        </button>
      </div>
    }
  </div>

  @if (errorMessage) {
    <p class="lib-input__error">{{ 'common.validation.'+errorMessage | translate }}</p>
  }
</div>
