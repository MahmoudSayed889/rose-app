<button 
    class="capitalize cursor-pointer transition-all flex justify-center items-center gap-3 disabled:opacity-75 disabled:cursor-not-allowed"
    [class]="styleClass()"
    [type]="type()"
    [disabled]="disabled()"
    (click)="handleClick()"
>
    @if (text()) {
        <span>{{text()}}</span>
    }

    @if(!loading()) {
        @if (iconLucide()) {
            <lucide-angular 
                [name]="iconLucide()?.name" 
                [class]="iconLucide()?.class" 
                [strokeWidth]="iconLucide()?.strokeWidth"
                [size]="iconLucide()?.size ?? '24px'">
            </lucide-angular>
        }
    
        @if (iconPrimeNg()) {
            <i [class]="'pi ' + iconPrimeNg()"></i>
        }
    }

    <i class="pi" style="font-size: .9rem;" [ngClass]="{
        'pi-spin pi-spinner': loading(),
    }"></i>
</button>
