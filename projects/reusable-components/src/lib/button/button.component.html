<button 
    class="capitalize cursor-pointer transition-all flex justify-center items-center gap-3 disabled:opacity-75 disabled:cursor-not-allowed"
    [class]="styleClass()"
    [type]="type()"
    [disabled]="disabled()"
    (click)="handleClick()"
>
    <span>{{text()}}</span>

    <i class="pi" style="font-size: .9rem;" [ngClass]="{
        'pi-spin pi-spinner': loading(),
    }"></i>
</button>
